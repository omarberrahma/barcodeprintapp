<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طباعة الباركود الذكية</title>

    <!-- خطوط جوجل لتحسين الخط العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- JsBarcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Tajawal', 'sans-serif'] } } }
        }
    </script>

    <style>
        /* إعدادات الشاشة العادية */
        @media screen {
            #print-area {
                display: none;
            }
        }

        /* إعدادات الطباعة الدقيقة (متوافقة مع طابعات الملصقات الحرارية) */
        @media print {
            @page {
                size: 50mm 30mm; /* مقاس الملصق */
                margin: 0;
            }
            body * {
                visibility: hidden;
            }
            body, html {
                margin: 0;
                padding: 0;
                background: white;
            }
            #app-container {
                display: none !important;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .label-card {
                width: 50mm;
                height: 30mm;
                box-sizing: border-box;
                padding: 2mm 3mm;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                page-break-after: always; /* الانتقال لملصق جديد بعد كل بطاقة */
                page-break-inside: avoid;
                background: white;
                margin: 0;
                overflow: hidden;
            }
            .label-card:last-child {
                page-break-after: auto;
            }
            .label-title {
                font-size: 11px;
                font-weight: bold;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
                text-align: center;
                line-height: 1.2;
            }
            .barcode-container {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 16mm;
            }
            .barcode-container svg {
                max-width: 44mm;
                height: 100%;
            }
            .label-footer {
                font-size: 10px;
                font-weight: bold;
                display: flex;
                justify-content: space-between;
                width: 100%;
                line-height: 1;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <!-- واجهة المستخدم (تختفي عند الطباعة) -->
    <div id="app-container" class="max-w-6xl mx-auto p-6">

        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-md mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold mb-2">طابعة الباركود الذكية</h1>
                <p class="text-indigo-100 text-sm">ارفع ملف الإكسل، حدد المنتجات والكميات، واطبع بكل سهولة.</p>
            </div>
            <label class="bg-white text-indigo-600 px-6 py-3 rounded-xl font-bold cursor-pointer shadow-lg hover:bg-indigo-50 transition transform hover:scale-105 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                اختر ملف الإكسل
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="hidden">
            </label>
        </header>

        <!-- لوحة التحكم والبحث -->
        <div class="bg-white p-5 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between border border-slate-200">
            <div class="flex items-center gap-3 w-full md:w-1/2">
                <div class="relative w-full">
                    <input type="text" id="search-input" placeholder="ابحث بالاسم أو الباركود..." class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 w-full text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto justify-between">
                <span id="total-count" class="text-sm text-slate-500 font-semibold bg-slate-100 px-3 py-1 rounded-lg">إجمالي المنتجات: 0</span>
                <button onclick="prepareAndPrint()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-emerald-700 transition flex items-center gap-2 transform hover:scale-105">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                    طباعة المحدد
                </button>
            </div>
        </div>

        <!-- جدول المنتجات -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden min-h-[400px]">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead class="bg-slate-100 text-slate-600 text-sm">
                        <tr>
                            <th class="p-4 w-16 text-center">
                                <input type="checkbox" id="select-all" class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" onchange="toggleSelectAll(this.checked)">
                            </th>
                            <th class="p-4 font-bold">اسم المنتج</th>
                            <th class="p-4 font-bold">الباركود</th>
                            <th class="p-4 font-bold">السعر</th>
                            <th class="p-4 font-bold text-center w-32">عدد النسخ</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm">
                        <tr>
                            <td colspan="5" class="text-center text-slate-400 py-20 text-lg">الرجاء رفع ملف الإكسل لعرض المنتجات هنا.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- منطقة الطباعة (مخفية، تظهر فقط في الطباعة) -->
    <div id="print-area"></div>

    <script>
        let globalProducts = [];

        // قراءة ملف الإكسل
        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);

                // تنظيف وتنظيم البيانات
                globalProducts = json.map((item, index) => {
                    return {
                        id: index,
                        designation: item['Désignation'] || item['Désignation Autres'] || item['Name'] || item['الاسم'] || 'منتج بدون اسم',
                        barcode: String(item['BARCODE'] || item['Barcode'] || item['code'] || item['الباركود'] || '00000000'),
                        price: item['Prix vente O1'] || item['Prix vente O'] || item['Price'] || item['السعر'] || '',
                        selected: false,
                        copies: 1
                    };
                });

                document.getElementById('search-input').value = '';
                document.getElementById('select-all').checked = false;
                renderTable();
            };
            reader.readAsArrayBuffer(file);
        });

        // البحث الفوري
        document.getElementById('search-input').addEventListener('input', function() {
            renderTable(this.value.toLowerCase());
        });

        // عرض الجدول
        function renderTable(searchTerm = '') {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const filtered = globalProducts.filter(p =>
                p.designation.toLowerCase().includes(searchTerm) ||
                p.barcode.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-400 py-10">لا توجد منتجات مطابقة للبحث.</td></tr>';
                document.getElementById('total-count').innerText = `إجمالي المنتجات: 0`;
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded cursor-pointer"
                               ${p.selected ? 'checked' : ''}
                               onchange="updateSelection(${p.id}, this.checked)">
                    </td>
                    <td class="p-3 text-slate-800 font-medium">${p.designation}</td>
                    <td class="p-3 text-slate-600">${p.barcode}</td>
                    <td class="p-3 text-emerald-600 font-bold">${p.price ? p.price + ' دج' : '-'}</td>
                    <td class="p-3 text-center">
                        <input type="number" min="1" max="999" class="border border-slate-300 rounded-lg w-20 px-2 py-1.5 text-center focus:ring-2 focus:ring-indigo-500 outline-none"
                               value="${p.copies}"
                               onchange="updateCopies(${p.id}, this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-count').innerText = `المنتجات المعروضة: ${filtered.length}`;

            const allSelected = filtered.length > 0 && filtered.every(p => p.selected);
            document.getElementById('select-all').checked = allSelected;
        }

        window.updateSelection = function(id, isSelected) {
            const product = globalProducts.find(p => p.id === id);
            if(product) product.selected = isSelected;
        };

        window.updateCopies = function(id, copies) {
            const product = globalProducts.find(p => p.id === id);
            if(product) product.copies = parseInt(copies) || 1;
        };

        window.toggleSelectAll = function(isChecked) {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            globalProducts.forEach(p => {
                if (p.designation.toLowerCase().includes(searchTerm) || p.barcode.toLowerCase().includes(searchTerm)) {
                    p.selected = isChecked;
                }
            });
            renderTable(searchTerm);
        };

        window.prepareAndPrint = function() {
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';

            const itemsToPrint = globalProducts.filter(p => p.selected && p.copies > 0);

            if (itemsToPrint.length === 0) {
                alert('يرجى تحديد منتج واحد على الأقل للطباعة.');
                return;
            }

            let barcodeIndex = 0;

            itemsToPrint.forEach(p => {
                for (let i = 0; i < p.copies; i++) {
                    const card = document.createElement('div');
                    card.className = 'label-card';
                    card.innerHTML = `
                        <div class="label-title">${p.designation}</div>
                        <div class="barcode-container">
                            <svg id="barcode-${barcodeIndex}"></svg>
                        </div>
                        <div class="label-footer">
                            <span>${p.barcode}</span>
                            ${p.price ? `<span>${p.price} دج</span>` : ''}
                        </div>
                    `;
                    printArea.appendChild(card);

                    try {
                        JsBarcode(\`#barcode-\${barcodeIndex}\`, p.barcode, {
                            format: "CODE128",
                            width: 1.4,
                            height: 40,
                            displayValue: false,
                            margin: 0,
                            background: "transparent"
                        });
                    } catch (err) {
                        console.error("Barcode error:", err);
                    }

                    barcodeIndex++;
                }
            });

            setTimeout(() => {
                window.print();
            }, 300);
        };
    </script>
</body>
</html>
